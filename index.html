function originPx(v,R,ds){const ox=R.x+clamp(R.w*.32,ds*1.05,R.w*.42);if(v==='top')return [ox,R.y+R.h*.5];let oy=R.y+R.h*.52;const fl=oy+(GRIPS_B()+.02)*ds;if(fl>R.y+R.h-4)oy-=fl-(R.y+R.h-4);return [ox,oy];}

function proj(v,q,R,ds){const [ox,oy]=originPx(v,R,ds);return v==='side'?[ox+q[0]*ds,oy-q[1]*ds]:[ox+q[0]*ds,oy+q[2]*ds];}

const PART_IC={sp:'🌀',ic:'🧊',pw:'💥',cl:'👯',ho:'🕳️'};
function drawView(g,v,R,ds,mini){g.save();g.beginPath();g.rect(R.x,R.y,R.w,R.h);g.clip();

 // 撃つ人

 if(v==='side'){line([0,.05,0],[0,.8,0],'#30343c',ds*.12);line([0,.85,0],[0,1.38,0],'#2f6fd6',ds*.3);}
 else{line([-.2,1.4,0],[.2,1.4,0],'#2f6fd6',ds*.26);}
 {const [hx,hy]=P([0,1.62,0]);g.fillStyle='#f3cdb0';g.beginPath();g.arc(hx,hy,ds*.17,0,Math.PI*2);g.fill();g.fillStyle='#30343c';g.beginPath();if(v==='side')g.arc(hx,hy,ds*.18,Math.PI,0);else g.arc(hx,hy,ds*.13,0,Math.PI*2);g.fill();
  const [ex,ey]=P([0,1.66,-.16]);g.fillStyle='#111';g.beginPath();g.arc(ex,ey,ds*.03,0,Math.PI*2);g.fill();}
 // 銃（2丁なら両方）と、もう片方の銃身
 for(const h of (two()||hand===1?[0,1]:[0])){const fh=frameOf(h);const W2=q=>S.toWorld(fh,q[0],q[1],q[2]);
  line(W2([-.3,0,0]),W2([0,0,0]),'#ff8a1f',ds*.09);line(W2([-.27,-.02,0]),W2([-.3,-.16,0]),'#2bb3a3',ds*.07);
  const sh=S.originOf(grip,h,true,0);line([sh[0]>0?.2:-.2,1.38,0],W2([-.27,-.02,0]),'#2f6fd6',ds*.08);
  if(h!==hand)for(const s of strokesOf(h)){if(s.p.length<2)continue;g.strokeStyle='rgba(27,95,147,.28)';g.lineWidth=ds*.06*S.WF[s.w];g.beginPath();s.p.forEach((q,i)=>{const [x,y]=P(W2(q));i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();}}

 const cur=strokesOf(hand);
 for(const s of cur)drawS(s.p,ds*.085*S.WF[s.w]+2,'#1b5f93');for(const s of cur)drawS(s.p,ds*.085*S.WF[s.w]-1.5,'#8fdcff');

 g.font=Math.round(ds*(mini?.16:.2))+'px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
 for(const q of hands[hand].parts){const s=cur[q.k];if(!s||!s.p[q.i])continue;const [x,y]=PL(s.p[q.i]);g.fillText(PART_IC[q.t],x,y);}
 g.textBaseline='alphabetic';
 // 銃の口
 const [mx,my]=PL([0,0,0]);const pulse=.5+.5*Math.sin(performance.now()/220);g.strokeStyle='rgba(255,122,26,'+(.4+.5*pulse)+')';g.lineWidth=3;g.beginPath();g.arc(mx,my,ds*.07+pulse*3,0,Math.PI*2);g.stroke();g.fillStyle='#ff3b2f';g.beginPath();g.arc(mx,my,ds*.03,0,Math.PI*2);g.fill();
 // 見出し
 g.fillStyle=mini?'#555':'#2d4a6b';g.font='900 '+(mini?11:13)+'px system-ui,sans-serif';g.textAlign='left';g.fillText((v==='side'?'↔↕ ':'↔⇅ ')+t(v==='side'?'vSide':'vTop')+(mini?' ('+t('tapSw')+')':''),R.x+8,R.y+(mini?14:18));
 g.restore();if(mini){g.strokeStyle='#1d1d1d';g.lineWidth=2.5;g.strokeRect(R.x,R.y,R.w,R.h);}}
function renderDraw(){const g=DG;g.clearRect(0,0,VW,VH);g.fillStyle='#d6e6f6';g.fillRect(0,0,VW,VH);drawView(g,view,AREA,DS,false);
 if(MINI){const ov=view==='side'?'top':'side';const ds=DS*Math.min(MINI.w/AREA.w,MINI.h/AREA.h)*1.25;drawView(g,ov,MINI,ds,true);}}
function nearestPt(v,x,y,maxPx){let best=null,bd=maxPx;strokesOf(hand).forEach((s,k)=>{const half=DS*.085*S.WF[s.w!=null?s.w:1]/2;s.p.forEach((q,i)=>{const [px,py]=proj(v,q,AREA,DS);const d=Math.hypot(px-x,py-y)-half;if(d<bd){bd=d;best=[k,i];}});});return best;}
const HIT=k=>Math.max(DS*k,36);
const inMini=(x,y)=>MINI&&x>=MINI.x&&x<=MINI.x+MINI.w&&y>=MINI.y&&y<=MINI.y+MINI.h;
DC.addEventListener('pointerdown',e=>{if(mode!=='draw'||drawing||bend)return;ac();const x=e.clientX,y=e.clientY;
 if(inMini(x,y)){setView(view==='side'?'top':'side');return;}
 if(dmode!=='draw'){const [ox0,oy0]=originPx(view,AREA,DS);const nearMuzzle=Math.hypot(x-ox0,y-oy0)<DS*.22;
  if(!strokesOf(hand).length||(nearMuzzle&&!nearestPt(view,x,y,HIT(.3)))){dmode='draw';toolsUi();}}
 if((dmode==='part'||dmode==='bend')&&!nearestPt(view,x,y,HIT(.5))&&strokesOf(1-hand).length){const oh=1-hand,keep=hand;hand=oh;if(nearestPt(view,x,y,HIT(.5))){toolsUi();toast(t(hand?'handLT':'handRT'),1500);}else hand=keep;}
 if(dmode==='part'){const pk=nearestPt(view,x,y,HIT(.4));if(!pk){toast(t('needBarrel'));return;}const ps=hands[hand].parts;const ex=ps.findIndex(q=>q.k===pk[0]&&Math.abs(q.i-pk[1])<=2);snap();
  if(ex>=0)ps.splice(ex,1);else{if(ps.length>=S.MAXPART){toast(t('partMax'));hist.pop();return;}if(pk[0]===0&&pk[1]===0)pk[1]=1;ps.push({k:pk[0],i:pk[1],t:ptype});SND.tick();}renderDraw();updStats();return;}
 if(dmode==='bend'){const pk=nearestPt(view,x,y,HIT(.5));if(!pk){toast(t('needBarrel'));return;}snap();bend={k:pk[0],i:pk[1],x0:x,y0:y,orig:JSON.parse(JSON.stringify(strokesOf(hand))),pid:e.pointerId};DC.setPointerCapture(e.pointerId);return;}
 if(totalInk()>=S.INK-.05){toast(t('noInk'));return;}
 const st=strokesOf(hand);let start=null,at=null,ext=-1;const [ox,oy]=originPx(view,AREA,DS);
 if(!st.length){if(Math.hypot(x-ox,y-oy)<DS*.22)start=[0,0,0];}
 else{const pk=nearestPt(view,x,y,HIT(.3));if(pk){const s=st[pk[0]];start=s.p[pk[1]].slice();if(pk[1]>=s.p.length-3){ext=pk[0];if(s.w!==thick){at=[pk[0],s.p.length-1];ext=-1;start=s.p[s.p.length-1].slice();}}else at=pk.slice();}}

DC.addEventListener('pointermove',e=>{

 if(!drawing||e.pointerId!==drawing.pid)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
 for(const ev of evs){const q=unproj(view,ev.clientX,ev.clientY,drawing.fixed);const lp=drawing.raw[drawing.raw.length-1];const d=Math.hypot(q[0]-lp[0],q[1]-lp[1],q[2]-lp[2]);if(d<.012)continue;
  if(forbidden(q)){drawing.stop=1;continue;}if(drawing.stop)continue;
  const left=(S.INK-totalInk())/S.WINK[thick];if(left<=0){drawing.stop=1;toast(t('noInk'));continue;}
  if(d>left){const k=left/d;drawing.raw.push([lp[0]+(q[0]-lp[0])*k,lp[1]+(q[1]-lp[1])*k,lp[2]+(q[2]-lp[2])*k]);drawing.len+=left;drawing.stop=1;continue;}
  drawing.raw.push(q);drawing.len+=d;}

// 曲げる：つまんだ点のまわりを、なめらかに動かす（根もとは動かない。枝はいっしょに動く）
function applyBend(d){const st=JSON.parse(JSON.stringify(bend.orig));const s=st[bend.k];const cum=[0];for(let i=1;i<s.p.length;i++)cum.push(cum[i-1]+Math.hypot(s.p[i][0]-s.p[i-1][0],s.p[i][1]-s.p[i-1][1],s.p[i][2]-s.p[i-1][2]));
 const R2=.5,base=cum[bend.i];const moved=s.p.map((q,i)=>{const u=Math.abs(cum[i]-base)/R2;let w=u<1?(1-u*u)*(1-u*u):0;w*=Math.min(1,cum[i]/.15);return [q[0]+d[0]*w,q[1]+d[1]*w,q[2]+d[2]*w];});
 const disp=moved.map((q,i)=>[q[0]-s.p[i][0],q[1]-s.p[i][1],q[2]-s.p[i][2]]);s.p=moved;
 const shift=(k,dv)=>{st.forEach((c,ci)=>{if(c.at&&c.at[0]===k){const dd=dv[c.at[1]]||[0,0,0];const cd=c.p.map(()=>dd);c.p=c.p.map(q=>[q[0]+dd[0],q[1]+dd[1],q[2]+dd[2]]);shift(ci,cd);}});};shift(bend.k,disp);
 for(const c of st)for(const q of c.p){const w=S.toWorld(frameOf(hand),q[0],q[1],q[2]);if(w[1]<.03){q[1]+=.03-w[1];}}
 hands[hand].strokes=st;}
function endStroke(){if(bend){bend=null;hands[hand].strokes=S.roundTrip(strokesOf(hand));renderDraw();updStats();return;}if(!drawing)return;const d=drawing;drawing=null;
 if(d.raw.length>=2&&d.len>=.05){let p=S.tidy(d.raw);snap();const st=strokesOf(hand);
  if(d.ext>=0){st[d.ext].p=st[d.ext].p.concat(p.slice(1));}
  else if(d.at){if(p.length>=2)st.push({at:d.at,p,w:thick});}
  else st.unshift({at:null,p,w:thick});
  let over=totalInk()-S.INK;if(over>0){const s=d.ext>=0?st[d.ext]:(d.at?st[st.length-1]:st[0]);while(over>0&&s.p.length>2){const q=s.p.pop(),r=s.p[s.p.length-1];over-=Math.hypot(q[0]-r[0],q[1]-r[1],q[2]-r[2])*S.WINK[s.w];}}
  hands[hand].strokes=S.roundTrip(st);hands[hand].parts=hands[hand].parts.filter(q=>hands[hand].strokes[q.k]&&q.i<hands[hand].strokes[q.k].p.length);}
 renderDraw();updStats();}

function makeGun(spec){const hs=[0,1].map(h=>{const src=(spec.hands&&spec.hands[h])||{};const st=S.roundTrip(src.strokes||[]);const pt=(src.parts||[]).filter(q=>st[q.k]&&q.i>=0&&q.i<st[q.k].p.length).slice(0,S.MAXPART);return {strokes:st,parts:pt};});
 const two=hs[1].strokes.length>0;const A=hs.map(h=>S.analyze(h.strokes,h.parts));const fs=[];if(spec.grip)fs.push(['','oh','cr','bk'][spec.grip]);if(two)fs.push('dw');
 const f0=S.features(hs[0].strokes.length?hs[0].strokes:hs[1].strokes,hs[0].strokes.length?A[0]:A[1]);fs.push(...(f0.match(/../g)||[]));
 return {hands:hs,A,two,grip:spec.grip||0,th:0,f:fs.slice(0,3).join(''),sh:spec.sh||[],mv:spec.mv||[]};}
function newWorld(kind,gun,shots,count){return {kind,gun,shots:shots.slice(),si:0,t:-count,P:S.newPaper(),fired:[],over:null,overT:0,log:[],hits:0,lastAim:[null,null],self:0,jamT:null,ev:[],sx:0,mv:[]};}
const mvAt=(mv,t)=>{if(!mv||!mv.length)return 0;const f=clamp(t/.1,0,mv.length-1),i=Math.floor(f),k=f-i;return (mv[i]+(mv[Math.min(mv.length-1,i+1)]-mv[i])*k)/100;};
function fireShot(Wd){const [cx,cy]=S.paperCenter(Wd.P);const g=Wd.gun,gp=S.GRIPS[g.grip||0];
 for(const h of (g.two?[0,1]:[0])){const o=S.originOf(g.grip||0,h,g.two,Wd.sx);const sh=S.fire(g.A[h],0,cx,cy,Wd.t,o,gp.y0,Wd.sx);sh.vis=[];sh.hand=h;Wd.fired.push(sh);Wd.lastAim[h]=sh.aim;Wd.ev.push(['trig',sh]);
  for(const b of sh.bullets){b.k=0;b.done=false;b.out=false;}if(sh.jam&&Wd.jamT==null)Wd.jamT=sh.jam.t;}}
function wTick(Wd,bits){Wd.log.push(bits);
 if(Wd.t>=0&&Wd.kind==='dodge'&&!Wd.over)S.stepPaper(Wd.P,bits,DT);
 if(Wd.kind==='dodge')Wd.sx=mvAt(Wd.gun.mv,Wd.t);
 else if(Wd.t>=0&&!Wd.over&&!Wd.closed&&Wd.t<S.TESTWIN){const m=((bits&1)?1:0)-((bits&2)?1:0);Wd.sx=clamp(Wd.sx+m*S.WALK*DT,-S.SXMAX,S.SXMAX);if(Wd.mv.length<=Math.floor(Wd.t/.1+1e-6))Wd.mv.push(Math.round(Wd.sx*100));}
 if(!Wd.over||Wd.over==='hit'){while(Wd.si<Wd.shots.length&&Wd.t>=Wd.shots[Wd.si]&&Wd.jamT==null){fireShot(Wd);Wd.si++;}}
 if(Wd.jamT!=null&&Wd.t>=Wd.jamT&&!Wd.over){Wd.over='jam';Wd.overT=Wd.t;Wd.ev.push(['jam']);}
 for(const sh of Wd.fired)for(const b of sh.bullets){if(b.done||Wd.jamT!=null)continue;if(Wd.t<b.tex)continue;if(!b.out){b.out=true;Wd.ev.push(['exit',b,sh]);}
  while(b.k<b.pts.length&&b.pts[b.k][3]<=Wd.t){const q=b.pts[b.k],a=b.k>0?b.pts[b.k-1]:q;
   const c=S.crossPaper(Wd.P,a,q,b.r);
   if(c&&c.hit){b.done=true;b.hitPaper=1;Wd.hits++;Wd.ev.push(['hole',c,q]);if(Wd.kind==='dodge'&&!Wd.over){Wd.over='hit';Wd.overT=Wd.t;}break;}
   if(c&&c.near&&!b.graze){b.graze=1;Wd.ev.push(['graze',c,q]);}
   b.k++;}
  if(!b.done&&b.k>=b.pts.length){b.done=true;const q=b.pts[b.pts.length-1]||[0,0,0];if(b.end==='self'){Wd.self++;Wd.ev.push(['self',q]);if(Wd.kind==='test'&&!Wd.over){Wd.over='self';Wd.overT=Wd.t;}}else if(b.end==='floor')Wd.ev.push(['floor',q]);}}
 const allDone=Wd.fired.every(sh=>sh.bullets.every(b=>b.done));
 if(!Wd.over&&allDone){if(Wd.kind==='dodge'&&Wd.si>=Wd.shots.length&&Wd.t>Wd.shots[Wd.shots.length-1]+.2){Wd.over='dodged';Wd.overT=Wd.t;}
  if(Wd.kind==='test'&&Wd.si>=Wd.shots.length&&(Wd.shots.length>=S.MAXSHOT||Wd.t>=S.TESTWIN||Wd.closed)&&Wd.t>.1){Wd.over=Wd.shots.length?(Wd.fired.some(s=>S.reaches(s))?'ok':'noreach'):'none';Wd.overT=Wd.t;}}

const v3=new THREE.Vector3();const LINE_T=.2;
function shotVisuals(sh){sh.vis=sh.bullets.map(b=>{const m=new THREE.Mesh(BUL_G,BUL_M);m.scale.setScalar(Math.max(.035,b.r*.9));m.visible=false;FX.add(m);
  const pts=[];for(let i=0;i<b.pts.length;i+=3)pts.push(new THREE.Vector3(b.pts[i][0],b.pts[i][1],b.pts[i][2]));
  let line=null;if(pts.length>=2){const ex=S.toWorld(sh.fr,b.ex.p[0],b.ex.p[1],b.ex.p[2]);pts.unshift(new THREE.Vector3(...ex));line=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),Math.min(160,pts.length*2),.03,5,false),LINE_M.clone());line.material.userData.tmp=1;line.renderOrder=4;FX.add(line);}
  const tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(30),3));const trail=new THREE.Line(tg,TRAIL_M);trail.visible=false;trail.frustumCulled=false;FX.add(trail);
  return {m,line,trail};});}
function renderWorld(Wd){if(!Wd)return;paperPose(Wd.P);placeGun(Wd.gun,Wd.sx,Wd.lastAim,Wd.over==='self'&&Wd.kind==='test'?Math.min(1.3,(Wd.t-Wd.overT)*3):0);
 for(const sh of Wd.fired){if(!sh.vis.length)shotVisuals(sh);
  sh.bullets.forEach((b,i)=>{const V=sh.vis[i];
   // 予測線：弾が出る 0.2 秒前から、出るまでの一瞬だけ
   if(V.line){const ls=Math.max(sh.t,b.tex-LINE_T);const k=Wd.t<ls?0:Wd.t<b.tex?1:Math.max(0,1-(Wd.t-b.tex)/.1);V.line.visible=k>0;V.line.material.opacity=.85*k;}
   if(Wd.jamT!=null&&Wd.t>=Wd.jamT){V.m.visible=false;V.trail.visible=false;return;}
   if(Wd.t<b.tex){const ip=b.inside;const tt=Wd.t-sh.t;let j=0;while(j<ip.length-1&&ip[j+1][3]<tt)j++;const a=ip[j],c=ip[Math.min(ip.length-1,j+1)];const k=c[3]>a[3]?clamp((tt-a[3])/(c[3]-a[3]),0,1):0;
    const w=S.toWorld(sh.fr,lerp(a[0],c[0],k),lerp(a[1],c[1],k),lerp(a[2],c[2],k));V.m.position.set(w[0],w[1],w[2]);V.m.visible=true;V.trail.visible=false;return;}
   if(b.done&&(b.k>=b.pts.length||b.hitPaper)){V.m.visible=false;V.trail.visible=false;return;}
   const k=Math.max(0,b.k-1),q=b.pts[k];if(!q){V.m.visible=false;return;}V.m.position.set(q[0],q[1],q[2]);V.m.visible=true;
   const arr=V.trail.geometry.attributes.position.array;for(let n=0;n<10;n++){const qq=b.pts[Math.max(0,k-n*2)];arr[n*3]=qq[0];arr[n*3+1]=qq[1];arr[n*3+2]=qq[2];}V.trail.geometry.attributes.position.needsUpdate=true;V.trail.visible=true;});}}
function handleEvents(Wd,live){for(const e of Wd.ev){const k=e[0];
  if(k==='trig'){if(live){SND.trig();const d=Math.min(...e[1].bullets.map(b=>b.tex))-e[1].t;setTimeout(()=>SND.line(),Math.max(0,d-LINE_T)*1000);}const ex=e[1].bullets[0];if(live&&ex)SND.whoosh(ex.tex-e[1].t);}
  else if(k==='exit'){const b=e[1];const p=b.pts[0];if(p&&live){SND.shot();}if(p)spark(p,0xffd23a,6,2);}
  else if(k==='hole'){paperMark(e[1].u,e[1].w,true);spark(e[2],0xf4ead2,14,3);if(live)SND.hit();}
  else if(k==='graze'){paperMark(e[1].u,e[1].w,false);if(live)SND.graze();}
  else if(k==='floor'){spark(e[1],0xcab89a,8,1.5);if(live)SND.ping();}
  else if(k==='self'){spark(e[1],0xff4040,16,3);if(live)SND.self();}
  else if(k==='jam'){for(const P2 of PIVS){if(!P2.piv.visible)continue;const q=P2.piv.position;spark([q.x,q.y,q.z],0xff8a1f,40,5);spark([q.x,q.y,q.z],0x555555,25,3);P2.piv.visible=false;}if(live)SND.boom();}}
 Wd.ev.length=0;}

$('gReg').onclick=async()=>{const nm=($('gName').value.trim()||t('defName')).slice(0,16);ls.set('gj_gname',$('gName').value.trim());const mm=$('gMsg');$('gReg').disabled=true;mm.textContent=t('regging');mm.className='note';
 const body={n:nm,f:GUN.f,p:S.encode(GUN.hands[0].strokes)||':0,0 1,0',th:0,sh:GUN.sh.join(','),v:1};if(GUN.hands[0].parts.length)body.pt=S.encParts(GUN.hands[0].parts);if(GUN.two){body.p2=S.encode(GUN.hands[1].strokes);if(GUN.hands[1].parts.length)body.pt2=S.encParts(GUN.hands[1].parts);}if(GUN.grip)body.g=GUN.grip;if(GUN.mv.some(x=>x!==0))body.mv=GUN.mv.join(',');
 if(PV){GUN.code='PVTEST23';GUN.n=nm;regDone();return;}
 try{const a=await fbAuth();let ok=false,code;for(let i=0;i<3&&!ok;i++){code=newCode();const r=await fetchR(FB.databaseURL+'/gojuu'+QA(a),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({['guns/'+code]:{...body,u:a.uid,t:{'.sv':'timestamp'}},['last/'+a.uid]:{t:{'.sv':'timestamp'}}})});ok=r.ok;if(!ok&&i===0){const g=await fetchR(DB('last/'+a.uid)+QA(a)).then(x=>x.ok?x.json():null).catch(()=>null);if(g&&g.t&&Date.now()-g.t<16000){mm.textContent=t('regWait');mm.className='note err';$('gReg').disabled=false;return;}}}
  if(!ok)throw new Error('reg');GUN.code=code;GUN.n=nm;GUN.u=a.uid;GUN.mine=true;const mine=ls.get('gj_mine',[]);mine.push(code);ls.set('gj_mine',mine.slice(-50));regDone();}
 catch(e){console.warn(e);mm.textContent=t('regErr');mm.className='note err';$('gReg').disabled=false;}};
function regDone(){$('gOk').hidden=true;$('gDone').hidden=false;$('gHead').textContent=t('regDone');$('gHead').className='big2 ok';$('gSub').textContent=nick(GUN.f)+' 「'+GUN.n+'」';$('gCode').textContent=GUN.code;$('gMsg').textContent='';$('gRetest').hidden=true;$('gRedraw').hidden=false;}
$('gX').onclick=()=>openX(t('postGun',{n:GUN.n,f:nick(GUN.f),c:GUN.code}),GAME_URL+'?c='+GUN.code);

// 結果の記録（その銃で1回目だけ。自分の銃は入らない）
async function submitRes(gun,h){const el=$('rStat');const setM=(m,c)=>{if(GUN===gun&&!$('resPanel').hidden){el.textContent=m;el.className='note '+(c||'');}};
 if(PV){setM(t('kdLine',{kd:'1.50',h:3,d:2}),'ok');return;}
 setM(t('sending'));try{const a=await fbAuth();const mine=await getJ(DB('res/'+gun.code+'/'+a.uid)+'.json');
  if(mine){const c=await getJ(DB('cnt/'+gun.code)+'.json');setM(t('already')+(c?'　'+kdTxt(c):''));return;}
  for(let i=0;i<3;i++){const c=await getJ(DB('cnt/'+gun.code)+'.json');const na=(c?c.a:0)+1,nh=(c?c.h:0)+h,D=Math.max(1,na-nh);const k=na>=10?Math.floor(nh*1000/D):-1;
   const body={['res/'+gun.code+'/'+a.uid]:{h,t:{'.sv':'timestamp'}},['cnt/'+gun.code]:{a:na,h:nh,k,n:gun.n,f:gun.f}};
   const r=await fetchR(FB.databaseURL+'/gojuu'+QA(a),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
   if(r.ok){setM(t('sent')+'　'+kdTxt({a:na,h:nh}),'ok');return;}await new Promise(r2=>setTimeout(r2,300+Math.random()*500));}
  setM(t('sendErr'),'err');}catch(e){console.warn(e);setM(t('sendErr'),'err');}}
const kdOf=c=>(c.h/Math.max(1,c.a-c.h));const kdTxt=c=>t('kdLine',{kd:kdOf(c).toFixed(2),h:c.h,d:c.a-c.h});

let rankFrom='title';
async function openRank(from){rankFrom=from||'title';show('rankPanel');$('rkTitle').textContent=t('rkTitle');$('rkNote').textContent=t('rkNote');const box=$('rankBox');box.innerHTML='<p class="c">'+esc(t('loading'))+'</p>';
 try{let rows;if(PV&&PV.rank)rows=PV.rank;else{const [d,h]=await Promise.all([getJ(DB('cnt')+'.json?orderBy=%22k%22&startAt=0&limitToLast=150'),getJ(DB('hidden')+'.json').catch(()=>null)]);rows=Object.entries(d||{}).map(([id,v])=>({...v,id})).filter(r=>!(h&&h[r.id])&&typeof r.k==='number'&&r.k>=0&&r.a>=10);}
  rows.sort((a,b)=>b.k-a.k||b.a-a.a);rows=rows.slice(0,100);const mine=ls.get('gj_mine',[]);
  if(!rows.length){box.innerHTML='<p class="c">'+esc(t('rkEmpty'))+'</p>';return;}
  let rk=0,prev=null;box.innerHTML='<table class="rank">'+rows.map((r,i)=>{if(r.k!==prev){rk=i+1;prev=r.k;}return '<tr data-c="'+esc(r.id)+'"'+(mine.includes(r.id)?' class="me"':'')+'><td class="r">'+rk+'</td><td class="n">'+esc(r.n)+'<small>'+esc(nick(r.f))+' ・ '+esc(r.id)+'</small></td><td class="c">'+kdOf(r).toFixed(2)+'<small>'+esc(t('kdS',{h:r.h,d:r.a-r.h}))+'</small></td></tr>';}).join('')+'</table>';
  box.querySelectorAll('tr').forEach(tr=>tr.onclick=()=>{ac();const c=tr.getAttribute('data-c');const m=document.createElement('p');playCode(c,$('rkNote'));});}
 catch(e){console.warn(e);box.innerHTML='<p class="c">'+esc(t('rkErr'))+'</p>';}}
$('bRank').onclick=()=>openRank('title');$('rRank').onclick=()=>openRank('res');
$('rankBack').onclick=()=>{if(rankFrom==='res')show('resPanel');else showTitle();};

// ===== 動画（記録した操作でもう一度動かして撮る） =====
let vidBusy=false,vidExt='mp4';
$('rVid').onclick=()=>{if(!vidBusy)makeVideo('dodge');};$('gVid').onclick=()=>{if(!vidBusy)makeVideo('test');};
$('vBack').onclick=()=>show(vidFrom);let vidFrom='resPanel';
async function makeVideo(kind){vidFrom=kind==='test'?'regPanel':'resPanel';vidBusy=true;const VW2=540,VH2=960;const vc=document.createElement('canvas');vc.width=VW2;vc.height=VH2;
 if(!vc.captureStream||!window.MediaRecorder){vidDone(null);return;}
 show(null);const keep=mode;mode='video';$('recBadge').hidden=false;$('recBadge').textContent='● '+t('making');
 const g=vc.getContext('2d');let VR;try{VR=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});}catch(e){mode=keep;vidDone(null);return;}VR.setSize(VW2,VH2,false);VR.setPixelRatio(1);VR.outputColorSpace=THREE.SRGBColorSpace;
 const VC=CAM.clone();VC.aspect=VW2/VH2;const keepVW=VW,keepVH=VH;VW=VW2;VH=VH2;camFor(kind,0);VC.copy(CAM);VC.aspect=VW2/VH2;VC.updateProjectionMatrix();VW=keepVW;VH=keepVH;
 ac();let dest=null;try{dest=AC.createMediaStreamDestination();master.connect(dest);}catch(e){}
 const stream=vc.captureStream(30);if(dest)dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
 const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
 const mime=types.find(x=>{try{return MediaRecorder.isTypeSupported(x)}catch(e){return false}})||'';vidExt=mime.includes('mp4')?'mp4':'webm';
 let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:4e6}:{});}catch(e){fin();vidDone(null);return;}
 const chunks=[];rec.ondataavailable=ev2=>{if(ev2.data&&ev2.data.size)chunks.push(ev2.data);};const stopped=new Promise(r=>{rec.onstop=r;});rec.start(200);
 // もう一度動かす
 const log=GUN.log||[];clearFX();resetStage();buildGun(GUN);
 const shots=kind==='test'?GUN.testShots||[]:GUN.sh.map(x=>x/1000);const Wd=newWorld(kind,GUN,shots,0);
 const first=shots.length?shots[0]:0;const start=Math.max(0,first-1.0);const cnt0=kind==='test'?2.0:3.0;let li=Math.round(cnt0/DT);
 // 頭出し（音を出さずに start まで進める）
 while(Wd.t<start-1e-9){wTick(Wd,log[li++]||0);handleEvents(Wd,false);}
 const F='"Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif';const txt=(s2,x,y)=>{g.strokeText(s2,x,y);g.fillText(s2,x,y);};
 let T=0,last=performance.now(),endT=null;const head=kind==='test'?t('testA'):t('gunBy',{n:GUN.n||t('defName')});
 await new Promise(res=>{function step(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
   const slow=Wd.over==='hit'&&Wd.t-Wd.overT<.6?.35:1;let n=Math.round(dt*slow/DT);while(n-->0&&endT==null){wTick(Wd,log[li++]||0);handleEvents(Wd,true);if(Wd.over&&endT==null&&Wd.t-Wd.overT>1.3)endT=T;}
   if(!Wd.over&&Wd.t>start+14)endT=T;
   stepSparks(dt);renderWorld(Wd);if(Wd.over==='self'){SHOOT.rotation.x=Math.min(1.3,(Wd.t-Wd.overT)*3);}
   if(kind==='dodge'){const kv=VW,kh=VH;VW=VW2;VH=VH2;camFor('dodge',0,Wd.P.x);VC.position.copy(CAM.position);VC.quaternion.copy(CAM.quaternion);VW=kv;VH=kh;camFor('dodge',0,0);}
   VR.render(SC,VC);g.clearRect(0,0,VW2,VH2);g.drawImage(VR.domElement,0,0,VW2,VH2);
   g.textAlign='center';g.lineJoin='round';g.lineWidth=7;g.strokeStyle='#fff';g.fillStyle='#1d1d1d';g.font='900 30px '+F;txt(head,VW2/2,58);g.font='900 22px '+F;g.fillStyle='#333';txt(nick(GUN.f),VW2/2,92);
   if(Wd.over){const msg=Wd.over==='hit'?t('hit'):Wd.over==='dodged'?t('dodged'):Wd.over==='self'?t('self'):Wd.over==='jam'?t('jam'):'';if(msg){g.lineWidth=10;g.strokeStyle='#000';g.fillStyle=Wd.over==='dodged'?'#9be07a':'#ffd0cc';g.font='900 62px '+F;txt(msg,VW2/2,VH2*.3);}}
   g.lineWidth=6;g.strokeStyle='#000a';g.fillStyle='#fff';g.font='900 26px '+F;txt('#ごジュウに',VW2/2,VH2-70);g.font='700 20px system-ui,sans-serif';txt(GAME_URL.replace('https://','')+(GUN.code?'?c='+GUN.code:''),VW2/2,VH2-36);
   if(endT!=null&&T>endT+.2)res();else requestAnimationFrame(step);}requestAnimationFrame(step);});
 rec.stop();await stopped;fin();vidDone(new Blob(chunks,{type:(mime||'video/webm').split(';')[0]}));
 function fin(){try{if(dest)master.disconnect(dest);}catch(_){}try{VR.dispose();}catch(_){}$('recBadge').hidden=true;mode=keep;}}
function vidDone(blob){vidBusy=false;show('vidPanel');
 if(!blob||!blob.size){$('vMsg').textContent=t('vfail');$('vShare').hidden=$('vSave').hidden=true;$('vidPrev').hidden=true;return;}
 $('vidPrev').hidden=false;const url=URL.createObjectURL(blob);$('vidPrev').src=url;$('vidPrev').play().catch(()=>{});
 const nm='gojuuni_'+(GUN.code||resKind)+'.'+vidExt;const file=new File([blob],nm,{type:blob.type});const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
 $('vShare').hidden=!canShare;$('vSave').hidden=false;$('vMsg').textContent=canShare?t('vmade'):t('shareHint');
 const post=()=>vidFrom==='regPanel'?(resKind==='jam'?t('postJam'):t('postSelf')):t(resKind==='hit'?'postHit':'postDodge',{n:GUN.n,f:nick(GUN.f),c:GUN.code});const purl=()=>GUN.code&&vidFrom!=='regPanel'?GAME_URL+'?c='+GUN.code:GAME_URL;
 $('vShare').onclick=async()=>{try{await navigator.share({files:[file],text:post()+'\n'+purl()});}catch(e){}};
 $('vSave').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=nm;document.body.appendChild(a);a.click();a.remove();};
 $('vX').onclick=()=>openX(post(),purl());}

// ===== まわす =====
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const raw=Math.min(.25,Math.max(0,(now-last)/1000));last=now;mT+=raw;
 if(toastT&&now>toastT){$('toast').hidden=true;toastT=0;}
 if(mode==='video')return;
 if(mode==='draw'){renderDraw();return;}
 if(jumpPulse>0)jumpPulse-=raw;
 if((mode==='test'||mode==='dodge'||mode==='testEnd'||mode==='dodgeEnd')&&W){acc+=raw;let n=0;const slow=W.over==='hit'&&W.t-W.overT<.6?.3:1;
  while(acc>=DT/slow&&n<40){acc-=DT/slow;n++;wTick(W,mode==='dodge'||mode==='test'?inputBits():0);}
  if(mode==='test'||mode==='dodge')countUi(W);handleEvents(W,true);updTrig&&mode==='test'&&updTrig();
  if(W.over&&mode==='test')testEnd();if(W.over&&mode==='dodge')dodgeEnd();
  if(W.over==='self'&&W.kind==='test')SHOOT.rotation.x=Math.min(1.3,(W.t-W.overT)*3);
  renderWorld(W);camFor(W.kind,mT,W.kind==='test'?W.sx:W.P.x);}
 else camFor('title',mT);
 stepSparks(raw);if(!window.__NR)R.render(SC,CAM);}

// ===== はじめ =====
resize();applyLang();
if(OGP||ICON){runOgp();}
else{showTitle();const c=cleanCode(QS.get('c'));if(c.length===8){$('codeIn').value=c;$('tTarget').scrollIntoView&&0;$('bCode').classList.add('or');}requestAnimationFrame(loop);}
function runOgp(){const w=OGP?1200:512,h=OGP?630:512;document.body.style.width=w+'px';document.body.style.height=h+'px';R.setPixelRatio(1);R.setSize(w,h,false);CAM.aspect=w/h;
 // 枝がいっぱいの変な銃と、飛んでくる弾と予測線
 const main=S.tidy([[0,0],[.25,.06],[.45,-.04],[.65,.06],[.9,0],[1.1,.02]]);const st=[{at:null,p:main}];
 [[5,.22,.18],[9,-.2,.22],[13,.16,.3],[17,-.18,.3],[21,.12,.26]].forEach(([i,dy,dx])=>{if(main[i]){const a=main[i];st.push({at:[0,i],p:S.tidy([a,[a[0]+dx*.5,a[1]+dy*.6],[a[0]+dx,a[1]+dy]])});}});
 const gun=makeGun({hands:[{strokes:st.map(x=>({...x,p:x.p.map(q=>[q[0],q[1]*.7,q[1]*.5])})),parts:[{k:0,i:8,t:'sp'}]},{strokes:[]}],grip:0,sh:[0]});GUN=gun;buildGun(gun);
 const Wd=newWorld('dodge',gun,[0],0);Wd.P.x=.3;W=Wd;const until=Math.min(...Wd.A.exits.map(e=>e.t))+.38;for(let i=0;i<Math.round(until/DT);i++){wTick(Wd,0);handleEvents(Wd,false);}Wd.P.yaw=-.55;Wd.P.x=-.15;Wd.over=null;renderWorld(Wd);
 for(const sh of Wd.fired)sh.vis.forEach(V=>{if(V.line){V.line.visible=true;V.line.material.opacity=.85;}});
 if(OGP){CAM.fov=38;CAM.position.set(2.4,2.0,-L-3.6);CAM.lookAt(-1.1,1.25,-L+5.5);}else{CAM.fov=40;CAM.position.set(.9,1.55,-L-2.3);CAM.lookAt(-.25,1.05,-L+2);}
 CAM.updateProjectionMatrix();R.render(SC,CAM);
 if(OGP){const T=$('ogpT');T.hidden=false;T.innerHTML='<b>'+(lang==='en'?'GO<em>JUU</em>NI':'ご<em>ジュウ</em>に')+'</b><i>'+esc(t('ogp2'))+'</i><s>'+esc(t('ogp3'))+'</s>';}
 window.__ogpReady=1;}
window.__GJpv={R,SC,CAM,SHOOT,PIVS,PAPER,S,DT,newWorld,wTick,handleEvents,renderWorld,camFor,buildGun,resetStage,clearFX,stepSparks,makeGun,renderDraw,drawResize,updStats,big,toolsUi,
 setMode:m=>{mode=m;},setDraw:(h,dr,o)=>{hands=h;drawing=dr;if(o){if(o.view)view=o.view;if(o.grip!=null)grip=o.grip;if(o.hand!=null)hand=o.hand;if(o.dmode)dmode=o.dmode;if(o.thick!=null)thick=o.thick;}},hideHud,show,applyLang};
window.__GJ={px:(v,q)=>proj(v,q,AREA,DS),get view(){return view;},PAPER,CAM,THREE,SC,get W(){return W;},get mode(){return mode;},S,startTest,startDodge,makeGun,get hands(){return hands;},set hands(v){hands=v;},setGrip:v=>{grip=v;},setView,pressTrig,gunFrom,openRank,showTitle};
