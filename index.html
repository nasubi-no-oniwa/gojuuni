function t(k,o){let s=(TX[lang]&&TX[lang][k]!=null)?TX[lang][k]:(TX.ja[k]!=null?TX.ja[k]:k);if(o)for(const x in o)s=String(s).split('{'+x+'}').join(o[x]);return s;}
function nick(f){const W=(TX[lang]||TX.ja).nk;const ws=(String(f||'st').match(/../g)||['st']).map(p=>W[p]).filter(Boolean);return (ws.length?ws:[W.st]).join(W.sep)+W.suf;}

// ===== 音 =====
let AC=null,master=null,NB=null;
function ac(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function nbuf(){if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function noise(at,dur,type,f,q,vol,f2){if(!AC)return;const s=AC.createBufferSource();s.buffer=nbuf();s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,at);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,at+dur);fl.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.006);g.gain.exponentialRampToValueAtTime(.0001,at+dur);s.connect(fl).connect(g).connect(master);s.start(at);s.stop(at+dur+.02);}
function tone(at,f,dur,type,vol,f2){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+dur);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.006);g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g).connect(master);o.start(at);o.stop(at+dur+.02);}
const SND={
 trig(){if(!ac())return;const n=AC.currentTime;tone(n,1800,.03,'square',.06);tone(n+.02,1300,.04,'square',.04);},
 line(){if(!ac())return;const n=AC.currentTime;tone(n,2400,.12,'sine',.06,3200);},
 shot(){if(!ac())return;const n=AC.currentTime;noise(n,.22,'lowpass',2600,1,.35,300);tone(n,140,.18,'sine',.22,55);},
 whoosh(d){if(!ac())return;const n=AC.currentTime;tone(n,300,Math.max(.05,d),'sawtooth',.03,1400);},
 hit(){if(!ac())return;const n=AC.currentTime;noise(n,.18,'bandpass',1800,1.4,.3);tone(n,220,.25,'square',.08,90);},
 graze(){if(!ac())return;const n=AC.currentTime;noise(n,.12,'highpass',3500,1,.12,6000);},

 tick(){if(!ac())return;const n=AC.currentTime;tone(n,1100,.05,'sine',.08);},
 go(){if(!ac())return;const n=AC.currentTime;tone(n,660,.1,'triangle',.1);tone(n+.1,990,.18,'triangle',.1);},

// 音楽：よける・試し撃ちのあいだに流す（少し先まで予約して鳴らす）
let bgm=null;
function bgmStart(kind){if(PV||!ac())return;bgmStop();const out=AC.createGain();out.gain.setValueAtTime(.0001,AC.currentTime);out.gain.exponentialRampToValueAtTime(kind==='dodge'?.5:.36,AC.currentTime+.6);out.connect(master);
 const st={next:AC.currentTime+.08,step:0,out};const sp=60/(kind==='dodge'?148:128)/4;const bass=[33,33,36,33,31,31,29,28];
 const T=(at,f,d,type,v,f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+d);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(v,at+.005);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g).connect(out);o.start(at);o.stop(at+d+.02);};
 const Nz=(at,d,f,v)=>{const s2=AC.createBufferSource();s2.buffer=nbuf();const fl=AC.createBiquadFilter();fl.type='highpass';fl.frequency.value=f;const g=AC.createGain();g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(v,at+.003);g.gain.exponentialRampToValueAtTime(.0001,at+d);s2.connect(fl).connect(g).connect(out);s2.start(at);s2.stop(at+d+.02);};
 const mf=m=>440*Math.pow(2,(m-69)/12);
 st.timer=setInterval(()=>{if(!AC)return;if(st.next<AC.currentTime-.05)st.next=AC.currentTime+.02;
  while(st.next<AC.currentTime+.12){const at=st.next,i=st.step%16,bar=Math.floor(st.step/16);
   if(i%4===0)T(at,120,.26,'sine',.34,45);if(i===4||i===12)Nz(at,.12,1500,.18);Nz(at,.03,7000,i%2?.03:.055);
   if(i%2===0){const m=bass[(bar*2+(i>>3))%8];T(at,mf(m+12),sp*1.8,'sawtooth',.06,mf(m+12)*.98);}
   if(kind==='dodge'&&i%4===2)T(at,mf(69+[0,3,7,10][bar%4]),.09,'square',.02);
   st.step++;st.next+=sp;}},25);bgm=st;}
function bgmStop(){if(!bgm)return;clearInterval(bgm.timer);const o=bgm.out;bgm=null;try{o.gain.cancelScheduledValues(AC.currentTime);o.gain.setTargetAtTime(.0001,AC.currentTime,.12);setTimeout(()=>{try{o.disconnect();}catch(_){}},800);}catch(e){}}

en:[
['How to play',`<ul><li><b>Shooter</b>: draw the barrel freely from the muzzle and test fire. If it doesn't hit you, doesn't misfire, and at least one bullet reaches the target area, you can register it and get an 8-letter code</li>
<li><b>Target</b>: become the paper target and dodge someone's bullets. Enter a code or pick a random gun. One hit and it's over</li>
<li>The target is 12 m away</li>
<li>Posting a gun on X makes a link with its code. Anyone who opens it can dodge that gun right away</li></ul>`],
['Drawing',`<ul><li>Drawing from the <b>side</b> bends the barrel up/down. From the <b>top</b>, left/right. Switch with "Side | Top" or tap the small view</li>
<li>Pick which view first. After "Next" you're asked whether to draw from the other view too. "Skip" goes straight to the test fire</li>
<li><b>✏️Draw</b>: start at the glowing muzzle. Drawing from a barrel's end continues it; from the middle makes a <b>branch</b>. You can only start at the muzzle or on a barrel</li>
<li><b>✋Bend</b>: grab the line and drag; about 50 cm around the grabbed point bends smoothly. The part near the muzzle stays put. Branches move with it. Bending uses no ink</li>
<li>A line drawn from the side looks straight from the top, so bending it from the top makes a 3D barrel (and vice versa)</li>
<li><b>Ink</b>: 5.5 m (shared by both guns when dual-wielding). Thicker lines use more</li>
<li>You can't draw below the floor or inside the shooter's body/head (the line stops there)</li>
<li>Numbers on top: <b>Speed</b> at the exit (fastest bullet), <b>Bullets</b> per trigger pull, <b>Delay</b> from trigger to the first bullet leaving the barrel</li></ul>`],
['Shapes & flight',`<ul><li><b>Speed</b>: starts at 58 km/h and gains 18 km/h per meter of barrel (depends on thickness). Max 173 km/h</li>
<li><b>Exit direction</b>: the bullet leaves along the barrel's last direction</li>
<li><b>Exit curl</b>: if the last 36 cm curve, the bullet keeps curving gently the same way</li>
<li><b>Loops</b>: each full turn adds 32 km/h and makes the bullet 25% lighter so it flies straighter (down to 35%)</li>
<li><b>Sharp corners</b>: corners sharper than 25° slow it down: about 30% at 90°, about half at 150°. Below 18 km/h the bullet jams and the gun <b>misfires</b></li>
<li><b>Branches</b>: each split makes bullets 0.85× as fast and 0.8× as big. Up to 32 bullets per trigger</li>
<li><b>Waves</b>: a line that flips its bend 4+ times makes the bullet wobble (12–60 cm). It flies along the line's overall direction</li>
<li><b>Spirals</b>: a line winding 1+ turns while its distance from the center changes a lot makes the bullet corkscrew (radius 15–70 cm)</li>
<li><b>Closed loop</b>: if the end touches its own line (within 10 cm), the bullet circles 3 times, +36 km/h each, then bursts out at the sharpest bend</li>
<li><b>Merging</b>: if the end is within 8 cm of another barrel, the bullet joins it</li>
<li><b>Length</b>: longer barrels take longer to fire; you see the bullet travel through the clear tube (about 0.3 s per meter at 72 km/h)</li>
<li><b>Straight up</b>: bullets leaving more than 55° up vanish into the sky and fall ~1.8 s later. Straight up lands on the shooter, 55° near the target</li>
<li><b>Downward</b>: bounces on the floor up to 3 times, slowing each time</li>
<li><b>Gravity</b>: bullets drop slowly; slower ones drop more</li>
<li><b>Self</b>: touching the shooter's body/head, or passing behind the shooter, means you <b>shot yourself</b></li>
<li><b>Auto-aim</b>: at the trigger pull, the gun turns up to ~29° so the main bullet passes ahead of the moving paper (85% of where it would be if it kept moving). Barrels pointing back at the shooter are not corrected</li></ul>`],
['Thickness',`<ul><li>Choose before drawing. Drawing a continuation with another thickness changes it from there</li>
<li><b>Thin</b>: small bullets (0.55×), +32 km/h per m, ink 0.6×</li>
<li><b>Normal</b>: bullets 1×, +18 km/h per m, ink 1×</li>
<li><b>Thick</b>: big bullets (1.6×), only +4 km/h per m, ink 1.6×</li>
<li><b>Huge</b>: giant balls (2.4×), −7 km/h per m, ink 2.4×. Too long and it jams</li>
<li>Bullet size comes from the barrel it exits. Bigger bullets hit more easily</li></ul>`],
['Parts',`<ul><li>Pick "🔩Parts", choose one, and tap the barrel. Tap the same spot again to remove. Up to 8 per gun</li>
<li>Each part works once on each bullet passing it</li>
<li>🌀<b>Spring</b>: +43 km/h</li><li>🧊<b>Ice</b>: speed ×0.6</li><li>💥<b>Powder</b>: speed ×1.5, then +22 km/h</li>
<li>👯<b>Clone</b>: the bullet splits in two, spreading ~6° left and right. Stack them to multiply</li>
<li>🕳️<b>Hole</b>: one bullet leaks out and rolls on the floor toward the paper's stand. It's big and slow. The main bullet slows to 0.85×. Targets can jump over it</li></ul>`],
['Grips & dual',`<ul><li>Tap the grip button to cycle. Dual guns share the grip</li>
<li>🤚<b>1 hand</b>: chest height (1.35 m), facing forward</li>
<li>🙌<b>Overhead</b>: above the head (2.05 m), shooting downward</li>
<li>🦵<b>Crotch</b>: knee height (0.5 m), low bullets</li>
<li>🔙<b>Backward</b>: held over the shoulder facing <b>backward</b>. A straight barrel shoots behind you; draw a U-turn to reach the target</li>
<li>🔫<b>Right/Left</b>: switches which gun you draw. Drawing a left gun makes <b>dual guns</b>: one trigger fires both, each aims on its own</li></ul>`],
['Test fire',`<ul><li>After "Ready" you have 12 s to press the trigger up to 10 times. Your timing is recorded and replayed against targets</li>
<li>Hold the left/right side (PC: ← →) to walk (8 km/h, up to 1.6 m). Your walk is recorded too</li>
<li>After one shot, "Done" ends early. In the test, the paper sways 0.8 m left and right (one round trip every 4.5 s)</li>
<li><b>To register</b>: no self-hit, no misfire, at least one bullet reaching the target area (2.1 m each side, 3 m high)</li>
<li>Name your gun. A <b>nickname</b> is added from its shape (branches, loops, waves, spirals, parts, grip, dual…)</li></ul>`],
['Dodging',`<ul><li><b>Move</b>: put a finger anywhere and slide left/right; the paper follows (about 1.35× your finger, up to 32 km/h, 1.6 m each side). PC: ← → (18 km/h)</li>
<li><b>Jump / crouch</b>: JUMP (bottom right) jumps about 1 m. Hold CROUCH (bottom left) to crouch (height 55%). Swiping up also jumps; swiping down crouches until you lift your finger. PC: ↑ or Space to jump, ↓ to crouch</li>
<li>You can move during the 3-2-1 countdown. The lane is narrow: 1.6 m to each side of the center</li>
<li>While moving, the paper turns up to 45° and gets thinner</li>
<li><b>Muzzle</b>: the gun follows you before it fires. Watch where it points</li>
<li><b>Leading</b>: at the trigger pull the gun reads your movement and aims where you would be when the bullet arrives if you kept going (85% of the way). Keep running the same way and you get hit. Stop, turn back, jump or crouch after the trigger</li>
<li><b>Prediction line</b>: a red line flashes 0.2 s before each bullet leaves the barrel (the screen edge glows red too)</li>
<li><b>Close calls</b>: a bullet passing right by you shows "CLOSE CALL!" with a short slow-motion. Your dodges and close calls appear in the result and the post</li>
<li>Getting hit on the paper (head, neck, body) or its stand ends it. Near misses leave scorch marks. Android phones vibrate on a hit</li></ul>`],
['Ranking',`<ul><li>Guns ranked by K/D = hits ÷ dodges (0 dodges counts as 1)</li><li>Only guns played 10+ times, top 100</li>
<li>Only each person's first try per gun counts. Your own guns don't count</li><li>Tap a gun in the ranking to dodge it</li></ul>`]],
zh:[
['玩法',`<ul><li><b>射擊方</b>：從槍口自由畫出槍管後試射。沒打到自己、沒走火、至少1發到達紙靶範圍，就能登錄並拿到8個字的暗號</li>
<li><b>被射方</b>：變成紙靶閃躲別人的子彈。輸入暗號或隨機選槍。被打中1發就結束</li><li>靶子距離12公尺</li><li>把槍發到X會變成帶暗號的連結，點開就能馬上躲那把槍</li></ul>`],
['畫法',`<ul><li>從<b>側面</b>畫，槍管上下彎；從<b>上面</b>畫，左右彎。用上方「側面｜上面」或點右下小圖切換</li>
<li>先選從哪邊畫。畫好按「下一步」會問要不要從另一邊畫。選「不畫」直接試射</li>
<li><b>✏️畫</b>：從發光的槍口開始。從槍管末端畫是延長，從中間畫是<b>分岔</b></li>
<li><b>✋彎</b>：抓住線拖動，周圍約50公分會滑順地彎曲。槍口附近不動，分岔一起動。彎曲不用墨水</li>
<li>側面畫的線從上面看是直的，從上面彎就成了立體槍管（反過來也一樣）</li>
<li><b>墨水</b>5.5公尺，雙槍時兩把合計。越粗用越多</li><li>不能畫在地板下和射擊者身體裡</li>
<li>上方數字：<b>彈速</b>（最快的子彈）、<b>子彈數</b>（扣一次扳機）、<b>射出前</b>（到第一發離開槍口的時間）</li></ul>`],
['形狀與飛法',`<ul><li><b>彈速</b>：一開始時速58km，槍管每1公尺加快時速18km（依粗細不同），最快時速173km</li>

<li><b>朝上</b>：超過55度往上的子彈消失在空中，約1.8秒後從上面掉下。正上方會掉在射擊者頭上，55度掉在靶附近</li>

<li><b>自動瞄準</b>：扣扳機瞬間，槍會上下左右最多轉約29度，讓主子彈通過紙靶移動方向的前方（繼續移動時位置的85%）。朝射擊者方向的槍管不修正</li></ul>`],
['粗細',`<ul><li>畫之前選。延長時換粗細，從那裡開始改變</li><li><b>細</b>：子彈小（0.55倍），每公尺加快時速32km，墨水0.6倍</li>
<li><b>普通</b>：1倍，每公尺加快時速18km，墨水1倍</li><li><b>粗</b>：子彈大（1.6倍），每公尺只加快時速4km，墨水1.6倍</li>
<li><b>超粗</b>：大球（2.4倍），每公尺變慢時速7km，墨水2.4倍，畫太長會卡住</li><li>子彈大小由射出的槍管粗細決定，越大越容易打中</li></ul>`],
['零件',`<ul><li>選「🔩零件」再選種類，點槍管放上。再點一次拿掉。每把最多8個</li><li>每顆子彈通過時生效1次</li>
<li>🌀<b>彈簧</b>：加快時速43km</li><li>🧊<b>冰</b>：速度0.6倍</li><li>💥<b>火藥</b>：速度1.5倍再加快時速22km</li>
<li>👯<b>分身</b>：子彈分成2顆，左右各張開約6度</li><li>🕳️<b>洞</b>：漏出1顆子彈在地上滾，瞄準紙靶的腳（台座）。又大又慢。主子彈變0.85倍。可以跳過去</li></ul>`],
['拿法・雙槍',`<ul><li>按拿法按鈕切換，雙槍時兩把相同</li><li>🤚<b>單手</b>：胸口高度（1.35公尺）朝前</li><li>🙌<b>頭上</b>：頭上（2.05公尺）朝前，往下射</li>
<li>🦵<b>胯下</b>：膝蓋高度（0.5公尺），低彈道</li><li>🔙<b>背後</b>：從肩膀<b>朝後</b>拿。直直畫會往後飛，要畫U字才打得到靶</li>
<li>🔫<b>右手／左手</b>：切換要畫的槍。畫了左手就是<b>雙槍</b>，扣一次扳機兩把同時射，各自瞄準</li></ul>`],
['試射',`<ul><li>「預備」後12秒內最多按10次扳機。按下的時機會直接記錄，被射方也照這個時機</li>
<li>按住畫面左右（電腦用←→）可以走動（時速8km，左右1.6公尺內），走法也會記錄</li><li>打過1發後可以按「就這樣」提早結束。試射時紙靶會左右各晃0.8公尺（4.5秒來回一次）</li>
<li><b>登錄條件</b>：沒打到自己、沒走火、至少1發到達紙靶範圍（左右2.1公尺・高3公尺）</li><li>可以自己取槍名，也會依形狀自動加上<b>稱號</b></li></ul>`],
['閃躲',`<ul><li><b>移動</b>：手指放在畫面上左右滑，紙靶會跟著手指（約手指移動的1.35倍，最快時速32km，左右1.6公尺內）。電腦用←→（時速18km）</li>

<li>開始前的「3・2・1」就能移動。靶道很窄，從中間左右各1.6公尺</li>
<li>移動時紙靶最多轉45度變薄</li><li><b>槍口</b>：開槍前槍口就會追著你。看槍口方向就知道會往哪打</li>
<li><b>預判</b>：扣扳機瞬間，槍會看你的移動，瞄準你繼續移動時子彈到達那刻的位置（85%的距離）。一直往同方向跑就會中。扣扳機後停下、轉向、跳或蹲來躲</li>
<li><b>預測線</b>：子彈離開槍口前0.2秒，紅線閃一下（畫面邊緣也會發紅）</li>
<li><b>好險</b>：子彈從身邊擦過會出現「好險！」並短暫慢動作。躲過的數量和好險次數會顯示在結果和貼文</li>
<li>打中紙靶（頭・脖子・身體）或腳下台座就結束。擦過會留下焦痕。Android 手機被打中會震動</li></ul>`],
['排行榜',`<ul><li>依槍的K/D排名。K/D＝命中次數÷被躲次數（0次算1）</li><li>只列被玩過10次以上的槍，前100名</li><li>每人每把槍只計第一次，自己的槍不計</li><li>點排行榜上的槍就能躲那把槍</li></ul>`]],
ko:[
['놀이 방법',`<ul><li><b>쏘는 쪽</b>: 총구에서부터 총신을 자유롭게 그리고 시험 사격. 자기가 맞지 않고, 폭발하지 않고, 1발 이상 과녁 범위까지 닿으면 등록하고 8글자 암호를 받는다</li>
<li><b>맞는 쪽</b>: 종이 과녁이 되어 누군가의 총알을 피한다. 암호를 넣거나 랜덤으로 고른다. 1발이라도 맞으면 끝</li><li>과녁까지 12m</li><li>총을 X에 올리면 암호가 들어간 링크가 되어, 누른 사람은 바로 그 총으로 피할 수 있다</li></ul>`],
['그리는 법',`<ul><li><b>옆에서</b> 그리면 위아래로, <b>위에서</b> 그리면 좌우로 휜다. 위의 「옆에서｜위에서」나 오른쪽 아래 작은 그림으로 전환</li>
<li>먼저 어느 쪽부터 그릴지 고른다. 「다음」을 누르면 다른 방향에서도 그릴지 묻는다. 「안 그리고」면 바로 시험 사격</li>
<li><b>✏️그리기</b>: 빛나는 총구에서 시작. 총신 끝에서 그리면 이어지고, 중간에서 그리면 <b>갈라진다</b></li>
<li><b>✋구부리기</b>: 선을 잡고 끌면 주변 약 50cm가 부드럽게 휜다. 총구 근처는 안 움직이고, 갈래는 같이 움직인다. 잉크는 안 쓴다</li>
<li>옆에서 그린 선은 위에서 보면 곧으므로, 위에서 구부리면 입체 총신이 된다 (반대도 같다)</li>
<li><b>잉크</b> 5.5m, 쌍권총이면 두 자루 합쳐서. 굵을수록 많이 쓴다</li><li>바닥 아래와 쏘는 사람의 몸 안에는 그릴 수 없다</li>
<li>위의 숫자: <b>탄속</b>(가장 빠른 총알), <b>총알 수</b>(방아쇠 1번), <b>발사까지</b>(첫 총알이 총구를 나갈 때까지)</li></ul>`],
['모양과 날아가는 법',`<ul><li><b>탄속</b>: 처음 시속 58km, 총신 1m마다 시속 18km 빨라진다(굵기에 따라 다름). 최고 시속 173km</li>
<li><b>출구 방향</b>: 총신 마지막 방향으로 나간다</li><li><b>출구 버릇</b>: 마지막 36cm가 휘어 있으면 나간 뒤에도 같은 쪽으로 약하게 휜다</li>
<li><b>고리</b>: 같은 방향으로 1바퀴마다 시속 32km 빨라지고 25%씩 가벼워져 곧게 난다(최소 35%)</li>
<li><b>뾰족한 모서리</b>: 25도보다 급하면 느려진다. 90도에 약 3할, 150도에 약 절반. 시속 18km보다 느려지면 막혀서 <b>폭발</b></li>
<li><b>갈래</b>: 갈라질 때마다 속도 0.85배, 크기 0.8배. 방아쇠 1번에 최대 32발</li>
<li><b>물결</b>: 휘는 방향이 4번 이상 바뀌면 총알이 꿀렁거리며 난다(12〜60cm)</li>
<li><b>소용돌이</b>: 같은 방향으로 1바퀴 이상 감고 중심 거리가 크게 바뀌면 나선으로 난다(반경 15〜70cm)</li>
<li><b>출구 없는 고리</b>: 선 끝이 자기 선 10cm 안에 붙으면 안에서 3바퀴 돌며 매번 시속 36km 빨라지고, 가장 많이 휜 곳을 뚫고 나간다</li>
<li><b>합류</b>: 선 끝이 다른 총신 8cm 안이면 그쪽으로 합류</li><li><b>길이</b>: 길수록 발사가 늦다. 투명한 관 속을 가는 총알이 보인다(시속 72km면 1m에 약 0.3초)</li>
<li><b>위쪽</b>: 55도보다 위로 나간 총알은 하늘로 사라졌다가 약 1.8초 뒤 위에서 떨어진다. 바로 위면 쏜 사람 위, 55도면 과녁 근처</li>
<li><b>아래쪽</b>: 바닥에서 튕긴다. 튕길 때마다 느려지고 3번까지</li><li><b>무게</b>: 총알은 조금씩 떨어진다. 느릴수록 많이 떨어진다</li>
<li><b>자기를 향하면</b>: 쏜 사람의 몸이나 머리에 닿거나 뒤를 지나가면 <b>자기를 쏜</b> 것</li>
<li><b>자동 조준</b>: 방아쇠를 당긴 순간 종이가 움직이는 방향의 앞(그대로 움직였을 때 위치의 85%)을 지나도록 총이 상하좌우 약 29도까지 방향을 고친다. 쏜 사람 쪽으로 나가는 총신은 고치지 않는다</li></ul>`],
['굵기',`<ul><li>그리기 전에 고른다. 이어 그릴 때 다른 굵기로 하면 거기서부터 바뀐다</li><li><b>가늘게</b>: 총알 작음(0.55배), 1m마다 시속 32km 빨라짐, 잉크 0.6배</li>
<li><b>보통</b>: 1배, 1m마다 시속 18km, 잉크 1배</li><li><b>굵게</b>: 총알 큼(1.6배), 1m마다 시속 4km만, 잉크 1.6배</li>
<li><b>초굵게</b>: 큰 공(2.4배), 1m마다 시속 7km 느려짐, 잉크 2.4배. 너무 길면 막힌다</li><li>총알 크기는 나간 총신의 굵기로 정해진다. 클수록 잘 맞는다</li></ul>`],
['부품',`<ul><li>「🔩부품」을 고르고 종류를 골라 총신 위를 누른다. 다시 누르면 빠진다. 한 자루에 8개까지</li><li>지나가는 총알마다 1번씩 효과</li>
<li>🌀<b>스프링</b>: 시속 43km 빨라진다</li><li>🧊<b>얼음</b>: 속도 0.6배</li><li>💥<b>화약</b>: 속도 1.5배에 시속 22km 더</li>
<li>👯<b>분신</b>: 총알이 2개로 갈라져 좌우로 약 6도씩 벌어진다</li><li>🕳️<b>구멍</b>: 총알 1개가 새어 나와 바닥을 굴러 종이의 받침대를 노린다. 크고 느리다. 본체 총알은 0.85배. 점프로 피할 수 있다</li></ul>`],
['잡는 법·쌍권총',`<ul><li>잡는 법 버튼을 누를 때마다 바뀐다. 쌍권총이면 두 자루 같다</li><li>🤚<b>한 손</b>: 가슴 높이(1.35m)에서 앞으로</li><li>🙌<b>머리 위</b>: 머리 위(2.05m)에서 앞으로, 내려 쏘는 모양</li>
<li>🦵<b>가랑이</b>: 무릎 높이(0.5m), 낮은 총알</li><li>🔙<b>등 뒤로</b>: 어깨 너머 <b>뒤를 향해</b> 잡는다. 곧게 그리면 뒤로 날아가니 U자로 그려야 과녁에 닿는다</li>
<li>🔫<b>오른손／왼손</b>: 그릴 총을 바꾼다. 왼손 총을 그리면 <b>쌍권총</b>, 방아쇠 1번에 두 자루가 동시에, 각자 조준</li></ul>`],
['시험 사격',`<ul><li>「준비」 후 12초 동안 방아쇠를 10번까지. 누른 타이밍이 그대로 기록되고 맞는 쪽에서도 그대로 쏜다</li>
<li>화면 좌우를 누르면(PC는 ← →) 걸을 수 있다(시속 8km, 좌우 1.6m까지). 걷는 것도 기록된다</li><li>1발 이상 쏘면 「이걸로 결정」으로 일찍 끝낼 수 있다. 시험 사격에서 종이는 좌우로 0.8m씩 흔들린다(4.5초에 한 번 왕복)</li>
<li><b>등록 조건</b>: 자기가 맞지 않음, 폭발하지 않음, 1발 이상 과녁 범위(좌우 2.1m·높이 3m)까지 닿음</li><li>총 이름은 직접 짓고, 모양으로 <b>별명</b>도 자동으로 붙는다</li></ul>`],
['피하기',`<ul><li><b>이동</b>: 화면에 손가락을 대고 좌우로 밀면 종이가 손가락을 따라온다(손가락 움직임의 약 1.35배, 최고 시속 32km, 좌우 1.6m까지). PC는 ← →(시속 18km)</li>
<li><b>점프·앉기</b>: 오른쪽 아래 「점프」로 점프(약 1m), 왼쪽 아래 「앉기」를 누르는 동안 앉는다(키 55%). 위로 쓸어도 점프, 아래로 쓸면 손가락을 뗄 때까지 앉는다. PC는 ↑나 스페이스로 점프, ↓로 앉기</li>
<li>시작 전 「3·2·1」부터 움직일 수 있다. 사격장은 좁아서 가운데에서 좌우 1.6m씩</li>
<li>움직이는 동안 종이가 45도까지 돌아 얇아진다</li><li><b>총구</b>: 쏘기 전부터 총구가 나를 따라온다. 총구 방향을 보면 어디로 쏠지 알 수 있다</li>
<li><b>예측 사격</b>: 방아쇠를 당긴 순간 총이 내 움직임을 보고, 그대로 움직였을 때 총알이 닿을 무렵 있을 곳(의 85%)을 노린다. 같은 방향으로 계속 움직이면 맞는다. 방아쇠 뒤에 멈추기·방향 바꾸기·점프·앉기로 피한다</li>
